steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - -f
      - frontend-siniestro-facil/Dockerfile
      - frontend-siniestro-facil
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
substitutions:
  _REGION: us-central1
  _REPOSITORY: siniestro-facil
  _SERVICE: siniestro-facil-frontend
  _TAG: 0.1.0
  _VITE_API_BASE_URL: ""
options:
  logging: CLOUD_LOGGING_ONLY